services:
  microservice-api-gateway:
    container_name: microservice-api-gateway
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
      target: development
    command: pnpm run start:dev api-gateway
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/app
    env_file:
      - ./apps/api-gateway/.env

  microservice-payments:
    container_name: microservice-payments
    build:
      context: .
      dockerfile: ./apps/products/Dockerfile
      target: development
    command: pnpm run start:dev products
    ports:
      - '5000:5000'
    volumes:
      - .:/usr/src/app
    env_file:
      - ./apps/products/.env

  microservice-auth:
    container_name: microservice-auth
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: development
    command: pnpm run start:dev auth
    ports:
      - '5001:5001'
    volumes:
      - .:/usr/src/app
    env_file:
      - ./apps/auth/.env
